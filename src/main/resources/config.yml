# Dungeon Maze worlds
worlds: []
preloadWorlds: []

# World mangement
unloadWorldsOnPluginDisable: true

# Gameplay settings
allowSurface: true
worldProtection: false
# Use 1.13+ Bukkit material names, for example: STONE_BRICKS, OAK_PLANKS
blockWhiteList: []

# Update checker
updateChecker:
    enabled: true
    notifyInGame: true

# Permission Support
usePermissions: true
useBypassPermissions: true
alwaysAllowOp: false
authMeReloadedMustBeRegistered: true

# Dungeon Maze API settings
api:
    enabled: true

# Mob Spawner Populator
mobs:
- Blaze
- Creeper
- Enderman
- Ghast
- MagmaCube
- Pig
- PigZombie
- Silverfish
- Skeleton
- Spider
- Zombie

# Dungeon mobs and loot tuning
mobBoost:
    enabled: true
    healthMultiplier: 1.45
    damageMultiplier: 1.35
    speedMultiplier: 1.2
    knockbackMultiplier: 1.15

loot:
    defaultWeight: 1
    file: loot.yml
    minItems: 3
    maxItems: 6

portals:
    enabled: true

# Logging settings
logging:
    debug: false
    error: true

# Version information of the Dungeon Maze plugin
versionName: "0.2.6"
versionCode: 26
